apiVersion: apps/v1
kind: Deployment
metadata:
  name: oci-sentinelmesh-dashboard
  namespace: oci-sentinelmesh
  labels:
    app: oci-sentinelmesh-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oci-sentinelmesh-dashboard
  template:
    metadata:
      labels:
        app: oci-sentinelmesh-dashboard
    spec:
      containers:
        - name: dashboard
          image: oci-sentinelmesh-dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
          envFrom:
            - configMapRef:
                name: oci-sentinelmesh-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
